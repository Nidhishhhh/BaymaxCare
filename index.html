<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raspberry Pi Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 1rem;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #64748b;
    }

    .status-dot.active {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .feed-container {
      position: relative;
      width: 100%;
      height: 480px;
      background: #020617;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #334155;
    }

    .feed-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .placeholder-text {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-top: 1.25rem;
    }

    button {
      flex: 1;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease, opacity 0.2s ease;
    }

    .btn-start {
      background: var(--accent);
      color: #0f172a;
    }

    .btn-start:hover {
      background: var(--accent-hover);
    }

    .btn-stop {
      background: #334155;
      color: var(--text);
    }

    .btn-stop:hover {
      background: var(--danger);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>RPi 4 Control Panel</h1>
      <div class="status-badge">
        <div id="dot" class="status-dot"></div>
        <span id="statusText">Offline</span>
      </div>
    </header>

    <div class="card">
      <div class="feed-container">
        <div id="placeholder" class="placeholder-text">Camera stream is stopped</div>
        <img id="camStream" alt="Camera Stream" />
      </div>

      <div class="controls">
        <button id="startBtn" class="btn-start" onclick="startCamera()">View Camera</button>
        <button id="maxBtn" class="btn-stop" onclick="toggleFullscreen()" style="background:#0b7a7c;color:#fff" title="Maximize Screen">⛶ Maximize</button>
        <button id="stopBtn" class="btn-stop" onclick="stopCamera()" disabled>Stop Camera</button>
      </div>
    </div>
  </div>

  <script>
    const PI_IP = localStorage.getItem('baymaxcare_pi_ip') || "192.168.31.231";
    const BASE_URL = `http://${PI_IP}:5000`;

    const camStream = document.getElementById('camStream');
    const placeholder = document.getElementById('placeholder');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusText = document.getElementById('statusText');
    const dot = document.getElementById('dot');

    async function startCamera() {
      statusText.textContent = "Connecting...";

      try {
        await fetch(`${BASE_URL}/start`);

        camStream.src = `${BASE_URL}/video_feed?t=${Date.now()}`;
        camStream.style.display = "block";
        placeholder.style.display = "none";

        startBtn.disabled = true;
        stopBtn.disabled = false;
        dot.classList.add('active');
        statusText.textContent = "Live";
      } catch (err) {
        alert(`Could not connect to Raspberry Pi at ${PI_IP}:5000. Ensure cam_server.py is running.`);
        statusText.textContent = "Error";
      }
    }

    async function stopCamera() {
      try {
        await fetch(`${BASE_URL}/stop`);
      } catch (err) {
        console.error("Stop signal failed:", err);
      }

      camStream.src = "";
      camStream.style.display = "none";
      placeholder.style.display = "block";

      startBtn.disabled = false;
      stopBtn.disabled = true;
      dot.classList.remove('active');
      statusText.textContent = "Stopped";
    }

    function toggleFullscreen() {
      const feed = document.querySelector('.feed-container');
      if (!document.fullscreenElement) {
        if (feed.requestFullscreen) feed.requestFullscreen();
        else if (feed.webkitRequestFullscreen) feed.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
